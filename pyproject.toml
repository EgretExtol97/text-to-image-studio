[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-image-studio"
version = "0.9.4"
description = "Windows desktop text-to-image generation studio with a pluggable pipeline/worker backend."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "text-to-image-studio contributors" }]
dependencies = [
    "torch>=2.5",
    "diffusers>=0.31",
    "transformers>=4.46",
    "accelerate>=1.1",
    "safetensors>=0.4",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.10",
    "pillow>=11.0",
    "numpy>=2.1",
    "sqlalchemy>=2.0",
    "python-dotenv>=1.0",
    "rich>=13.9",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.8", "mypy>=1.13"]
cuda = ["xformers>=0.0.28"]

[project.scripts]
ttis = "text_to_image_studio.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["text_to_image_studio*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]